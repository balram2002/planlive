name: livewab

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  web:
    build:
      context: .
      target: runner
    image: livewab-app:latest
    container_name: livewab-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - uploads:/app/public/uploads
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G

  sweeper:
    build:
      context: .
      target: worker
    image: livewab-worker:latest
    container_name: livewab-sweeper
    restart: unless-stopped
    command: ["npx", "tsx", "scripts/sweeper.ts"]
    depends_on:
      web:
        condition: service_healthy
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 512M

  shipsync:
    build:
      context: .
      target: worker
    image: livewab-worker:latest
    container_name: livewab-shipsync
    restart: unless-stopped
    command: ["npx", "tsx", "scripts/reconcile-shipments.ts", "--watch"]
    depends_on:
      web:
        condition: service_healthy
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  uploads:
